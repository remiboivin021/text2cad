repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        # C90 = Complexité cyclomatique (McCabe)
        # E, W, F = Erreurs et lisibilité PEP8
        # B = Bugbear (bonnes pratiques)
        # SIM = Simplification du code (lisibilité)
        args: [--config, host/pyproject.toml, --select, "C90,E,W,F,B,SIM", --max-complexity, "10", --fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: run-tests
        name: Run tests
        entry: poetry --directory src run pytest
        files: ^src/
        language: system
        pass_filenames: false

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
        - id: commitlint
          stages: [commit-msg]
          additional_dependencies:
          - '@commitlint/config-conventional'
          - 'commitlint-config-gitmoji'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--ignore-words-list=ros,rviz,gazebo,urdf,xacro"]