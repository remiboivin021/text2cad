name: "Bug Report"
description: "Report a defect or unintended behavior"
title: "[Bug] "
type: Bug

projects:
  - "remiboivin021/1"

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Use this form to report **unexpected or incorrect behavior**.
        Bugs are triaged based on impact and severity.
        Incomplete reports will be closed.

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: |
        Provide **clear, ordered steps** to reproduce the issue.
      placeholder: |
        1. Go to [...]
        2. Click [...]
        3. Observe [...]
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: |
        Describe what should happen.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: |
        Describe what actually happens.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Provide relevant environment details.
      placeholder: |
        Browser/version, OS, feature flag state, deployment environment
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression?
      description: |
        Indicate whether this bug worked previously.
      placeholder: |
        Yes, last working version was [...]
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact Analysis
      description: |
        Who is affected and how?
        Include potential security or data integrity concerns.
    validations:
      required: true

  - type: textarea
    id: logs_evidence
    attributes:
      label: Logs / Evidence
      description: |
        Logs, screenshots, stack traces, or recordings.
        Redact sensitive data.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: |
        Related issues, discussions, or historical context.
    validations:
      required: false
