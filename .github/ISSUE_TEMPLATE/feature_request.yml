name: "Feature Request"
description: "Propose a new feature or a significant enhancement"
title: "[Feature] "
type: Feature

projects:
  - "remiboivin021/1"
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Use this form to propose a **new feature or major enhancement** for text2cad.
        This repository uses strict triage rules. Incomplete or low-quality submissions will be closed.

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: |
        Clearly describe the problem or limitation this feature addresses.
        Focus on *why* this is needed, not *how* to implement it.
      placeholder: |
        We currently cannot [...], which leads to [...]
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: |
        Describe the feature at a high level.
        Avoid implementation details unless strictly necessary.
      placeholder: |
        Introduce a mechanism that allows [...]
    validations:
      required: true

  - type: textarea
    id: stakeholders
    attributes:
      label: Stakeholders / Users
      description: |
        Identify who benefits from this feature (teams, roles, personas).
      placeholder: |
        ML engineers, makers, CAD users, contributors
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: |
        Define objective, testable criteria for feature acceptance.
        This section is mandatory and used for validation.
      placeholder: |
        - Given ..., when ..., then ...
        - Feature is considered complete when ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: |
        Explicitly state what is out of scope for this feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        List alternative solutions or approaches and why they were rejected.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: |
        External systems, teams, libraries, or prior work required.
      placeholder: |
        Depends on issue #123, lib X
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks & Trade-offs
      description: |
        Technical, product, or organizational risks.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: |
        Mockups, diagrams, links to discussions, or prior art.
    validations:
      required: false