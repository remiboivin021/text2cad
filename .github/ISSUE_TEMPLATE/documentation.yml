name: "Documentation"
description: "Report missing, incorrect, or incomplete documentation"
title: "[Docs] "
labels:
  - "Docs"
type: Task

projects:
  - "remiboivin021/1"
body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Issue

        Use this form to report **missing, outdated, unclear, or incorrect documentation**.
        Documentation quality is considered part of the product and follows the same triage rigor.

  - type: textarea
    id: affected_area
    attributes:
      label: Affected Documentation Area
      description: |
        Specify where the issue exists.
      placeholder: |
        README.md, API reference, onboarding guide, architecture docs
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current Documentation Issue
      description: |
        Describe what is wrong, missing, ambiguous, or misleading.
      placeholder: |
        The documentation states that [...], but in reality [...]
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Documentation
      description: |
        Describe what the documentation should state instead.
      placeholder: |
        The documentation should clearly explain [...]
    validations:
      required: true

  - type: textarea
    id: target_audience
    attributes:
      label: Target Audience
      description: |
        Who is affected by this documentation issue?
      placeholder: |
        developers, makers, new joiners
    validations:
      required: true

  - type: textarea
    id: suggested_changes
    attributes:
      label: Suggested Changes
      description: |
        Provide concrete suggestions, examples, or rewritten sections if possible.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: |
        Screenshots, diagrams, or historical context.
    validations:
      required: false
